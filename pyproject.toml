[project]
name = "intenttwin"
version = "0.1.0"
description = "Local closed-catalogue listing treatment experiment"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "jinja2>=3.1", "numpy>=1.24", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
intenttwin = "intenttwin.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intenttwin"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
