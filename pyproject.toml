[project]
name = "geolab"
version = "0.1.0"
description = "Measure how a product listing changes AI shopping-assistant recommendations"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["fastapi>=0.115", "jinja2>=3.1", "numpy>=1.24", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
geolab = "geolab.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geolab"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
